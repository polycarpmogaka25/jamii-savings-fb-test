# Local MI 4.4 deployment: mount individual artifacts instead of the empty CAR.
services:
  mi:
    image: ${MI_IMAGE:-wso2/wso2mi:4.4.0}
    ports:
      - "8290:8290"
      - "8253:8253"
    volumes:
      - ./database:/home/wso2carbon/wso2mi-4.4.0/repository/database
      - ./wso2-mi/integrations/src/main/wso2mi/artifacts/api:/home/wso2carbon/wso2mi-4.4.0/repository/deployment/server/synapse-configs/default/api:ro
      - ./wso2-mi/integrations/src/main/wso2mi/artifacts/sequences:/home/wso2carbon/wso2mi-4.4.0/repository/deployment/server/synapse-configs/default/sequences:ro
      - ./wso2-mi/integrations/src/main/wso2mi/artifacts/data-services:/home/wso2carbon/wso2mi-4.4.0/repository/deployment/server/dataservices:ro
      - ./drivers/h2.jar:/home/wso2carbon/wso2mi-4.4.0/lib/h2.jar:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"