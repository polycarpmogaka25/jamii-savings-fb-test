openapi: 3.0.1
info:
  title: Jamii Customers API
  description: Proxy API to fetch customer profile details.
  version: 1.0.0
paths:
  /customers/{customerId}:
    get:
      summary: Get customer by ID
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  email:
                    type: string
                  phone:
                    type: string
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Upstream error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Backend unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://localhost:9443/oauth2/token
          scopes: {}
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      - requestId
      - timestamp
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
security:
- OAuth2: []
