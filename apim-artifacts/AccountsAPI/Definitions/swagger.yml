openapi: 3.0.1
info:
  title: Jamii Accounts API
  version: 1.0.0
paths:
  /accounts/{accountNumber}/balance:
    get:
      summary: Get account balance
      parameters:
      - name: accountNumber
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountNumber:
                    type: string
                  status:
                    type: string
                  balance:
                    type: object
                  requestId:
                    type: string
                  timestamp:
                    type: string
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Upstream error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Backend unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://localhost:9443/oauth2/token
          scopes: {}
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      - requestId
      - timestamp
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
security:
- OAuth2: []
